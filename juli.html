<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#fbf5f8" />
  <title>Hechizo · Mis horarios</title>
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300..700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fbf5f8; --card: #ffffff; --card2: #f7ecf2; --accent: #8e3b78; --accent2: #c76a9f;
      --text: #2a1225; --muted: #6b4f63; --border: rgba(142,59,120,0.16); --hover: rgba(142,59,120,0.07);
      --danger: #c62f3e; --ok: #0b7285; --oro: #c28a12;
    }
    body { font-family: "DM Sans", sans-serif; font-weight: 450; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px;
           padding: calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 40px); }
    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    .hidden { display: none !important; }
    .wrap { max-width: 560px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .brand img { width: 40px; height: 40px; border-radius: 11px; }
    .brand-name { font-family: "DM Serif Display", serif; font-size: 24px; line-height: 1.1; }
    .brand-sub { font-size: 12px; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; font-weight: 600; }
    h2 { font-family: "DM Serif Display", serif; font-weight: 400; font-size: 21px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

    .semnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 10px; }
    .semnav button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); font-size: 18px; cursor: pointer; }
    .semnav .t { text-align: center; }
    .semnav .t b { display: block; font-weight: 600; }
    .semnav .t span { font-size: 12px; color: var(--muted); }
    .total { background: var(--card2); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .total b { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .total span { color: var(--muted); font-size: 13px; }

    .dias { display: flex; flex-direction: column; gap: 8px; }
    .dia { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left; width: 100%; }
    .dia:active { background: var(--hover); }
    .dia.hoy { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .dia.libre { background: transparent; }
    .dia .f { width: 46px; flex-shrink: 0; text-align: center; line-height: 1.1; }
    .dia .f b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; }
    .dia .f span { font-size: 20px; font-weight: 650; }
    .dia .h { flex: 1; min-width: 0; }
    .dia .h .hr { font-weight: 600; font-variant-numeric: tabular-nums; }
    .dia.libre .h .hr { color: var(--muted); font-weight: 450; }
    .dia .h .al { font-size: 12px; color: var(--muted); }
    .dia .h .nota { font-size: 13px; color: var(--accent); margin-top: 3px; }
    .dia .hs { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
    .tag { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; padding: 2px 7px; border-radius: 8px; margin-left: 6px; vertical-align: 1px; }
    .tag.cambio { background: rgba(194,138,18,.15); color: #8a5f00; }

    .btn { display: block; width: 100%; border: none; border-radius: 14px; padding: 13px; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; }
    .btn.sec { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .btn.peligro { background: transparent; color: var(--danger); border: 1px solid rgba(198,47,62,.4); }
    .btn + .btn { margin-top: 8px; }
    .btn.wa { background: #25d366; color: #fff; }
    .acciones { margin-top: 18px; }
    .msg { font-size: 13px; margin-top: 10px; min-height: 18px; text-align: center; }
    .msg.err { color: var(--danger); } .msg.ok { color: var(--ok); }

    /* Hoja de edición */
    /* Embebida en la app (Otros → Calendario de Juli): sin marca, con el tema de la app */
    body.embed { padding-top: 6px; }
    body.embed .brand, body.embed #saludo { display: none; }
    body.dark {
      --bg: #0e0720; --card: #231540; --card2: #2a1a4d; --accent: #c084fc; --accent2: #818cf8;
      --text: #f1e9ff; --muted: #9d8ec0; --border: rgba(192,132,252,0.15); --hover: rgba(192,132,252,0.10);
      --danger: #f87171; --ok: #34d399; font-weight: 400;
    }
    body.dark .tag.cambio { background: rgba(245,158,11,.18); color: #fbbf24; }
    body.dark .velo { background: rgba(0,0,0,.55); }
    body.dark input[type=time] { color-scheme: dark; }
    .velo { position: fixed; inset: 0; background: rgba(42,18,37,.35); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
    .hoja { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0;
            padding: 20px 18px calc(env(safe-area-inset-bottom,0px) + 20px); }
    .hoja h2 { margin-bottom: 4px; }
    .bloque { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .bloque input[type=time] { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; font-size: 16px; min-width: 0; }
    .bloque .x { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; flex-shrink: 0; }
    .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin: 16px 0 4px; }
    .link { background: none; border: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 8px 0; }
    select, textarea, .login input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; font-size: 16px; }
    textarea { resize: vertical; min-height: 60px; }
    .habitual-dia { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-top: 10px; }
    .habitual-dia .cab { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
    .habitual-dia .cab span { font-weight: 450; color: var(--muted); font-size: 13px; }
    .login { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 24px; text-align: center; margin-top: 30px; }
    .login p { color: var(--muted); font-size: 14px; margin: 6px 0 16px; }
    .login input { margin-bottom: 10px; text-align: center; }
    .cargando { color: var(--muted); text-align: center; padding: 30px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="icon-192.png" alt="" />
    <div><div class="brand-name">Hechizo</div><div class="brand-sub">Mis horarios</div></div>
  </div>

  <div id="login" class="login hidden">
    <h2>Hola, Juli</h2>
    <p>Poné la clave que te pasamos para cargar tus horarios.</p>
    <form onsubmit="entrar();return false">
      <input id="clave-in" type="password" autocomplete="current-password" placeholder="Clave" />
      <button class="btn" type="submit">Entrar</button>
    </form>
    <div class="msg err" id="login-err"></div>
  </div>

  <div id="app" class="hidden">
    <h2 id="saludo">Hola, Juli 👋</h2>
    <div class="sub" id="ayuda">Tocá un día para cambiar el horario de ese día (o marcar que no venís).</div>

    <div class="semnav">
      <button onclick="moverSemana(-1)" aria-label="Semana anterior">‹</button>
      <div class="t"><b id="sem-tit"></b><span id="sem-sub"></span></div>
      <button onclick="moverSemana(1)" aria-label="Semana siguiente">›</button>
    </div>
    <div class="total"><span>Total de la semana</span><b id="sem-total">—</b></div>
    <div class="dias" id="dias"><div class="cargando">Cargando…</div></div>

    <div class="acciones">
      <button class="btn sec" onclick="abrirHabitual()" id="btn-habitual">Mi semana habitual</button>
      <button class="btn wa hidden" onclick="mandarLinkJuli()" id="btn-wa">💬 Pasarle la página a Juli por WhatsApp</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<div id="velo" class="velo hidden" onclick="if(event.target===this)cerrarHoja()">
  <div class="hoja" id="hoja"></div>
</div>

<script>
  const API = "https://hechizo-reporte-nuevo-production.up.railway.app";
  const KEY = "hechizo_juli_key";
  const DIAS = ["", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
  const DIAS_C = ["", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
  const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

  // La clave puede venir en el link (#k=...): se guarda y se borra de la barra de direcciones.
  (function () {
    const m = location.hash.match(/k=([^&]+)/);
    if (m) { try { localStorage.setItem(KEY, decodeURIComponent(m[1])); } catch (e) {} history.replaceState(null, "", location.pathname); }
  })();
  // ?embed=1 → abierta desde la app: entra con la clave del reporte (X-Web-Key) y toma el tema de la app
  const EMBED = new URLSearchParams(location.search).get("embed") === "1";
  const KEY_USADA = EMBED ? "hechizo_web_key" : KEY;
  const HEADER = EMBED ? "X-Web-Key" : "X-Juli-Key";
  if (EMBED) {
    document.body.classList.add("embed");
    try { if (localStorage.getItem("hechizo_theme") !== "light") document.body.classList.add("dark"); } catch (e) {}
    document.getElementById("ayuda").textContent = "Tocá un día para cambiarle el horario a Juli, o “Semana habitual” para el horario fijo.";
  }
  let clave = (() => { try { return localStorage.getItem(KEY_USADA) || ""; } catch (e) { return ""; } })();

  async function api(path, opts = {}) {
    const res = await fetch(API + path, { ...opts, cache: "no-store",
      headers: { ...(opts.headers || {}), [HEADER]: clave, "Content-Type": "application/json" } });
    if (res.status === 401) {
      if (EMBED) throw new Error("clave del reporte incorrecta");
      try { localStorage.removeItem(KEY); } catch (e) {} clave = ""; mostrarLogin("Clave incorrecta"); throw new Error("401");
    }
    const j = await res.json().catch(() => ({}));
    if (!res.ok || j.ok === false) throw new Error(j.error || ("Error " + res.status));
    return j;
  }

  function mostrarLogin(err) {
    document.getElementById("app").classList.add("hidden");
    document.getElementById("login").classList.remove("hidden");
    document.getElementById("login-err").textContent = err || "";
  }
  function entrar() {
    clave = document.getElementById("clave-in").value.trim();
    if (!clave) return;
    try { localStorage.setItem(KEY, clave); } catch (e) {}
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    cargar();
  }

  // ── fechas ──
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const deIso = s => { const [a, m, d] = s.split("-").map(Number); return new Date(a, m - 1, d); };
  function lunesDe(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function sumarDias(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  const fmtH = h => { if (!h) return "0 h"; const t = Math.round(h * 60), hh = Math.floor(t / 60), mm = t % 60; return mm ? `${hh} h ${mm} min` : `${hh} h`; };
  const txtBloques = b => b.map(([a, z]) => `${a} a ${z}`).join(" y ");

  // El domingo ya no tiene sentido ver la semana que termina: arranca en la que viene
  const arranque = () => { const h = new Date(); return lunesDe(h.getDay() === 0 ? sumarDias(h, 1) : h); };
  let lunes = arranque();
  let datos = null;

  function moverSemana(n) { lunes = sumarDias(lunes, 7 * n); cargar(); }

  async function cargar() {
    const domingo = sumarDias(lunes, 6);
    document.getElementById("sem-tit").textContent = tituloSemana(lunes);
    document.getElementById("sem-sub").textContent = `${lunes.getDate()} ${MESES[lunes.getMonth()]} al ${domingo.getDate()} ${MESES[domingo.getMonth()]}`;
    document.getElementById("dias").innerHTML = '<div class="cargando">Cargando…</div>';
    try {
      datos = await api(`/juli/calendario?desde=${iso(lunes)}&hasta=${iso(domingo)}`);
      pintar();
    } catch (e) { if (e.message !== "401") document.getElementById("dias").innerHTML = `<div class="msg err">No se pudo cargar: ${esc(e.message)}</div>`; }
  }
  function tituloSemana(l) {
    const dif = Math.round((l - lunesDe(new Date())) / 864e5 / 7);
    return dif === 0 ? "Esta semana" : dif === 1 ? "La semana que viene" : dif === -1 ? "La semana pasada" : "Semana";
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function pintar() {
    const hoy = iso(new Date());
    let tot = 0;
    const html = datos.dias.map((d, i) => {
      tot += d.horas;
      const dt = deIso(d.fecha), dow = i + 1;
      const libre = !d.bloques.length;
      if (libre && dow >= 6 && d.origen === "habitual") return "";   // sábado/domingo sin nada: no se muestran
      return `<button class="dia ${libre ? "libre" : ""} ${d.fecha === hoy ? "hoy" : ""}" onclick="editarDia(${i})">
        <div class="f"><b>${DIAS_C[dow]}</b><span>${dt.getDate()}</span></div>
        <div class="h">
          <div class="hr">${libre ? (EMBED ? "No viene" : "No trabajo") : txtBloques(d.bloques)}${d.origen === "cambio" ? '<span class="tag cambio">Cambio</span>' : ""}</div>
          ${d.almuerzo_min ? `<div class="al">${d.almuerzo_min} min de almuerzo</div>` : ""}
          ${d.nota ? `<div class="nota">${esc(d.nota)}</div>` : ""}
        </div>
        <div class="hs">${libre ? "" : fmtH(d.horas)}</div>
      </button>`;
    }).join("");
    document.getElementById("dias").innerHTML = html;
    document.getElementById("sem-total").textContent = fmtH(tot);
  }

  // ── editor de bloques (compartido por día puntual y semana habitual) ──
  function htmlBloques(id, bloques) {
    return `<div id="${id}">${bloques.map(b => filaBloque(b)).join("")}</div>
      <button class="link" type="button" onclick="agregarBloque('${id}')">+ Agregar otro horario</button>`;
  }
  function filaBloque([a, z] = ["09:00", "14:00"]) {
    return `<div class="bloque"><input type="time" value="${a}" step="900"><span>a</span><input type="time" value="${z}" step="900">
      <button class="x" type="button" onclick="this.parentNode.remove()" aria-label="Quitar">✕</button></div>`;
  }
  function agregarBloque(id) {
    const c = document.getElementById(id);
    if (c.children.length >= 3) return;
    c.insertAdjacentHTML("beforeend", filaBloque());
  }
  function leerBloques(id) {
    return [...document.getElementById(id).querySelectorAll(".bloque")].map(r => {
      const [a, z] = r.querySelectorAll("input");
      return [a.value, z.value];
    }).filter(([a, z]) => a && z);
  }
  function htmlAlmuerzo(id, v) {
    return `<select id="${id}">${[0, 15, 30, 45, 60].map(m => `<option value="${m}" ${m === v ? "selected" : ""}>${m ? m + " min" : "Sin almuerzo"}</option>`).join("")}</select>`;
  }
  function abrirHoja(html) { document.getElementById("hoja").innerHTML = html; document.getElementById("velo").classList.remove("hidden"); }
  function cerrarHoja() { document.getElementById("velo").classList.add("hidden"); }

  function editarDia(i) {
    const d = datos.dias[i], dt = deIso(d.fecha);
    const bloques = d.bloques.length ? d.bloques : [["09:00", "14:00"]];
    abrirHoja(`<h2>${DIAS[i + 1]} ${dt.getDate()} de ${MESES[dt.getMonth()]}</h2>
      <div class="sub">${d.origen === "cambio" ? "Este día tiene un cambio cargado." : "Horario habitual. Si cambiás algo, vale solo para este día."}</div>
      <div class="lbl">Horario</div>${htmlBloques("ed-b", bloques)}
      <div class="lbl">Almuerzo</div>${htmlAlmuerzo("ed-a", d.almuerzo_min)}
      <div class="lbl">Nota (opcional)</div><textarea id="ed-n" maxlength="300" placeholder="${EMBED ? "Ej.: sale antes por el médico" : "Ej.: me voy antes por el médico"}">${esc(d.nota || "")}</textarea>
      <div class="acciones">
        <button class="btn" onclick="guardarDia(${i})">Guardar</button>
        <button class="btn peligro" onclick="guardarDia(${i}, true)">${EMBED ? "No viene este día" : "No vengo este día"}</button>
        ${d.origen === "cambio" ? `<button class="btn sec" onclick="volverHabitual(${i})">Volver al horario habitual</button>` : ""}
        <button class="btn sec" onclick="cerrarHoja()">Cancelar</button>
      </div><div class="msg err" id="ed-err"></div>`);
  }
  async function guardarDia(i, noVengo = false) {
    const d = datos.dias[i];
    const body = { fecha: d.fecha, bloques: noVengo ? [] : leerBloques("ed-b"),
                   almuerzo_min: Number(document.getElementById("ed-a").value), nota: document.getElementById("ed-n").value };
    if (!noVengo && !body.bloques.length) { document.getElementById("ed-err").textContent = "Poné al menos un horario o tocá “No vengo”."; return; }
    try { await api("/juli/dia", { method: "PUT", body: JSON.stringify(body) }); cerrarHoja(); aviso("Guardado ✓"); cargar(); }
    catch (e) { if (e.message !== "401") document.getElementById("ed-err").textContent = e.message; }
  }
  async function volverHabitual(i) {
    try { await api("/juli/dia?fecha=" + datos.dias[i].fecha, { method: "DELETE" }); cerrarHoja(); aviso("Listo, vuelve al horario habitual"); cargar(); }
    catch (e) { if (e.message !== "401") document.getElementById("ed-err").textContent = e.message; }
  }

  function abrirHabitual() {
    const sem = datos.semana_tipo;
    abrirHoja(`<h2>Mi semana habitual</h2>
      <div class="sub">Es el horario de todas las semanas. Para un día puntual, mejor tocá ese día en el calendario.</div>
      ${sem.map(s => `<div class="habitual-dia">
        <div class="cab">${DIAS[s.dia]} <label><span>No trabajo</span> <input type="checkbox" id="hl-${s.dia}" ${s.bloques.length ? "" : "checked"} onchange="document.getElementById('hw-${s.dia}').classList.toggle('hidden', this.checked)"></label></div>
        <div id="hw-${s.dia}" class="${s.bloques.length ? "" : "hidden"}">
          ${htmlBloques("hb-" + s.dia, s.bloques.length ? s.bloques : [["09:00", "14:00"]])}
          <div class="lbl" style="margin-top:6px">Almuerzo</div>${htmlAlmuerzo("ha-" + s.dia, s.almuerzo_min)}
        </div></div>`).join("")}
      <div class="acciones">
        <button class="btn" onclick="guardarHabitual()">Guardar semana habitual</button>
        <button class="btn sec" onclick="cerrarHoja()">Cancelar</button>
      </div><div class="msg err" id="hab-err"></div>`);
  }
  async function guardarHabitual() {
    const dias = datos.semana_tipo.map(s => {
      const libre = document.getElementById("hl-" + s.dia).checked;
      return { dia: s.dia, bloques: libre ? [] : leerBloques("hb-" + s.dia), almuerzo_min: libre ? 0 : Number(document.getElementById("ha-" + s.dia).value) };
    });
    try { await api("/juli/semana-tipo", { method: "PUT", body: JSON.stringify({ dias }) }); cerrarHoja(); aviso("Semana habitual guardada ✓"); cargar(); }
    catch (e) { if (e.message !== "401") document.getElementById("hab-err").textContent = e.message; }
  }

  function aviso(t) { const m = document.getElementById("msg"); m.className = "msg ok"; m.textContent = t; setTimeout(() => { m.textContent = ""; }, 3000); }

  if (EMBED) {
    document.getElementById("btn-habitual").textContent = "Semana habitual de Juli";
    document.getElementById("btn-wa").classList.remove("hidden");
  }
  // Arma el mensaje con el link (la clave va en el #, así entra directo) y la clave por si se la pide
  async function mandarLinkJuli() {
    const v = window.open("", "_blank");   // se abre ya, si no el celu bloquea la ventana
    try {
      const { clave: cj } = await api("/juli/clave");
      if (!cj) throw new Error("La clave de Juli no está configurada");
      const link = location.origin + location.pathname + "#k=" + encodeURIComponent(cj);
      const txt = `¡Hola Juli! 😊 Te paso la página para cargar tus horarios de Hechizo:
${link}

Tocá un día para cambiar el horario de ese día o marcar que no venís, y en "Mi semana habitual" está tu horario de siempre.
Si te pide clave, es: ${cj}`;
      const url = "https://wa.me/?text=" + encodeURIComponent(txt);
      if (v) v.location = url; else location.href = url;
    } catch (e) { if (v) v.close(); const m = document.getElementById("msg"); m.className = "msg err"; m.textContent = e.message; }
  }
  if (clave) { document.getElementById("app").classList.remove("hidden"); cargar(); }
  else if (EMBED) { document.getElementById("app").classList.remove("hidden"); document.getElementById("dias").innerHTML = '<div class="msg err">Falta la clave del reporte en la app</div>'; }
  else mostrarLogin();
</script>
