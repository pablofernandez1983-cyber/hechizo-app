<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Hechizo · Web</title>
  <link rel="icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e0720; --card: #1a0f33; --card2: #231540; --accent: #c084fc; --accent2: #818cf8;
      --danger: #f87171; --success: #34d399; --warn: #fbbf24;
      --text: #f1e9ff; --muted: #9d8ec0; --border: rgba(192,132,252,0.15); --hover: rgba(192,132,252,0.10);
      --zebra: rgba(255,255,255,0.02);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --dneg: #e66767;
      --grid: rgba(192,132,252,0.10); --axis: rgba(192,132,252,0.30);
    }
    body.light {
      --bg: #f5f0ff; --card: #ffffff; --card2: #f3edff; --accent: #7c3aed; --accent2: #6366f1;
      --danger: #dc2626; --success: #059669; --warn: #b45309;
      --text: #1a0a2e; --muted: #6b5b8a; --border: rgba(124,58,237,0.15); --hover: rgba(124,58,237,0.08);
      --zebra: rgba(124,58,237,0.025);
      --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --dneg: #e34948;
      --grid: rgba(124,58,237,0.08); --axis: rgba(124,58,237,0.28);
    }
    body { font-family: "DM Sans", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
    button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
    .hidden { display: none !important; }

    /* ── Layout ── */
    header { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--border); }
    .topbar { display: flex; align-items: center; gap: 16px; padding: 14px 24px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 32px; height: 32px; border-radius: 9px; }
    .brand-name { font-family: "DM Serif Display", serif; font-size: 20px; }
    .brand-sub { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
    nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav-btn { padding: 7px 16px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all .15s; }
    .nav-btn:hover { color: var(--text); background: var(--hover); }
    .nav-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
    .top-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .ghost-btn { background: transparent; border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 12px; color: var(--muted); cursor: pointer; }
    .ghost-btn:hover { color: var(--text); background: var(--hover); }
    .crumbs { display: flex; gap: 6px; align-items: center; padding: 0 24px 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; min-height: 18px; }
    .crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
    .crumbs a:hover { text-decoration: underline; }
    .crumbs .sep { opacity: .5; }
    main { padding: 20px 24px 60px; max-width: 1700px; margin: 0 auto; }

    /* ── Cards / KPIs ── */
    .page-title { font-family: "DM Serif Display", serif; font-size: 26px; margin-bottom: 4px; }
    .page-sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
    .kpi-l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .kpi-v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .kpi.clickable { cursor: pointer; } .kpi.clickable:hover { border-color: var(--accent); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    .card h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 20px; }
    .info-grid div span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 2px; }
    .notice { border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; border: 1px solid var(--border); background: var(--card2); }
    .notice.ok { border-color: rgba(52,211,153,.35); }
    .notice.warn { border-color: rgba(251,191,36,.45); }
    .notice b { font-weight: 600; }
    .notes { color: var(--muted); font-size: 12px; margin: -6px 0 14px; }
    .notes div::before { content: "• "; }

    /* ── Toolbar ── */
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .toolbar input[type=search], .toolbar input[type=date], .toolbar select {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; outline: none; }
    .toolbar input[type=search] { min-width: 240px; }
    .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
    .chip { padding: 6px 12px; border-radius: 16px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; }
    .chip:hover { color: var(--text); background: var(--hover); }
    .chip.active { border-color: var(--accent); color: var(--accent); background: var(--hover); font-weight: 500; }
    .spacer { flex: 1; }
    .count { color: var(--muted); font-size: 12px; }
    .btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 500; }
    .btn:hover { filter: brightness(1.1); }
    .btn.sec { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

    /* ── Tablas ── */
    .tbl-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--card); max-height: calc(100vh - 260px); }
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; font-size: 13px; }
    th, td { padding: 6px 8px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); }
    th { position: sticky; top: 0; background: var(--card2); z-index: 2; font-weight: 600; font-size: 11.5px; color: var(--muted); cursor: pointer; user-select: none; }
    td.txt { max-width: 210px; overflow: hidden; text-overflow: ellipsis; }
    th:hover { color: var(--text); }
    th.sorted { color: var(--accent); }
    th.num, td.num { text-align: right; }
    tbody tr:nth-child(even) td { background: var(--zebra); }
    tbody tr.link { cursor: pointer; }
    tbody tr.link:hover td { background: var(--hover); }
    td.neg { color: var(--danger); }
    td.wrap { white-space: normal; min-width: 200px; max-width: 360px; }
    tfoot td { position: sticky; bottom: 0; background: var(--card2); font-weight: 600; border-top: 1px solid var(--border); }
    .more { text-align: center; padding: 10px; }

    /* ── Estado de resultados ── */
    .pnl-wrap { max-height: none; }
    .pnl th:first-child, .pnl td:first-child { position: sticky; left: 0; z-index: 1; background: var(--card); min-width: 190px; }
    .pnl th:first-child { z-index: 3; background: var(--card2); }
    .pnl th { cursor: default; text-align: right; }
    .pnl th:first-child { text-align: left; }
    .pnl th.en-curso { color: var(--accent); }
    .pnl td { text-align: right; }
    .pnl td:first-child { text-align: left; }
    .pnl tbody tr:nth-child(even) td { background: transparent; }
    .pnl tr.cat td { font-weight: 600; background: var(--card2) !important; }
    .pnl tr.cat td:first-child { cursor: pointer; }
    .pnl tr.cat td:first-child::before { content: "▸ "; color: var(--muted); display: inline-block; width: 14px; }
    .pnl tr.cat.open td:first-child::before { content: "▾ "; }
    .pnl tr.rub td:first-child { padding-left: 26px; color: var(--muted); }
    .pnl td, .pnl th { padding: 6px 7px; }
    .pnl tr.tot td { font-weight: 700; font-size: 14px; border-top: 2px solid var(--accent); background: var(--card2) !important; }
    .pnl tr.sub td { color: var(--muted); font-size: 12px; }
    .pnl td.cell { cursor: pointer; border-radius: 0; }
    .pnl td.cell:hover { background: var(--hover) !important; outline: 1px solid var(--accent); outline-offset: -1px; }
    .pnl td.zero { color: var(--muted); opacity: .45; }
    .pnl td.col-tot { border-left: 1px solid var(--border); font-weight: 600; }
    .pos { color: var(--success); }
    .neg { color: var(--danger); }

    /* ── Barras (resumen de mes) ── */
    .bar-row { display: grid; grid-template-columns: 220px 1fr 130px; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 8px; cursor: pointer; }
    .bar-row:hover { background: var(--hover); }
    .bar-row .lbl { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-row .lbl.cat { font-weight: 600; }
    .bar-row .bar { height: 10px; border-radius: 5px; background: var(--accent2); min-width: 2px; }
    .bar-row .bar.neg { background: var(--danger); opacity: .8; }
    .bar-row .val { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
    .minibars { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding-top: 10px; }
    .minibars div { flex: 1; background: var(--accent2); border-radius: 3px 3px 0 0; min-height: 1px; position: relative; cursor: default; }
    .minibars div:hover { background: var(--accent); }
    .minibars-lbl { display: flex; gap: 3px; font-size: 10px; color: var(--muted); }
    .minibars-lbl span { flex: 1; text-align: center; overflow: hidden; }

    /* ── Gráficos (SVG) ── */
    .chart-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
    .chart-head h3 { margin: 0; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .chart svg { display: block; width: 100%; overflow: visible; }
    .chart .gl { stroke: var(--grid); stroke-width: 1; }
    .chart .ax { stroke: var(--axis); stroke-width: 1; }
    .chart text { fill: var(--muted); font-size: 11px; font-family: "DM Sans", sans-serif; font-variant-numeric: tabular-nums; }
    .chart text.dl { fill: var(--text); font-size: 11.5px; font-weight: 500; }
    .chart .band { fill: transparent; cursor: pointer; }
    .chart .band.on { fill: var(--hover); }
    .chart .seg { cursor: pointer; }
    .chart .seg:hover { filter: brightness(1.15); }
    .chart-note { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .chart-note b { color: var(--text); font-weight: 600; }
    .ver-datos { margin-top: 8px; font-size: 12px; }
    .ver-datos summary { cursor: pointer; color: var(--accent); width: fit-content; }
    .ver-datos .tbl-wrap { margin-top: 8px; }
    .grid2 > .card { min-width: 0; }
    .tt { position: fixed; z-index: 50; pointer-events: none; background: var(--card2); border: 1px solid var(--border); border-radius: 10px;
          padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.35); min-width: 190px; font-variant-numeric: tabular-nums; }
    .tt b { display: block; margin-bottom: 4px; font-weight: 600; }
    .tt div { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
    .tt div span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
    .tt i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
    .tt .tot { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 4px; font-weight: 600; }
    .seg-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .seg-toggle button { background: transparent; border: none; padding: 5px 12px; color: var(--muted); cursor: pointer; font-size: 12px; }
    .seg-toggle button.on { background: var(--accent); color: #fff; }

    /* ── Login / estados ── */
    .center { min-height: 70vh; display: flex; align-items: center; justify-content: center; }
    .login { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; width: 340px; text-align: center; }
    .login img { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 10px; }
    .login h1 { font-family: "DM Serif Display", serif; font-size: 24px; margin-bottom: 4px; }
    .login p { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .login input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; outline: none; }
    .login input:focus { border-color: var(--accent); }
    .login .btn { width: 100%; padding: 10px; }
    .login .err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }
    .loading { color: var(--muted); padding: 40px; text-align: center; }
    .loading::before { content: ""; display: inline-block; width: 14px; height: 14px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; margin-right: 8px; vertical-align: -2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box { color: var(--danger); padding: 20px; }
    a.inline { color: var(--accent); cursor: pointer; text-decoration: none; } a.inline:hover { text-decoration: underline; }

    @media (max-width: 700px) {
      .topbar, .crumbs, main { padding-left: 16px; padding-right: 16px; }
      .grid2 { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 130px 1fr 100px; }
      .toolbar input[type=search] { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <header id="header" class="hidden">
    <div class="topbar">
      <div class="brand">
        <img src="icon-192.png" alt="" />
        <div><div class="brand-name">Hechizo</div><div class="brand-sub">Reporte web</div></div>
      </div>
      <nav id="nav">
        <button class="nav-btn" data-sec="resultados">Resultados</button>
        <button class="nav-btn" data-sec="ventas">Ventas</button>
        <button class="nav-btn" data-sec="productos">Productos</button>
        <button class="nav-btn" data-sec="cobranzas">Cobranzas</button>
        <button class="nav-btn" data-sec="clientes">Clientes</button>
        <button class="nav-btn" data-sec="graficos">Gráficos</button>
      </nav>
      <div class="top-right">
        <span class="count" id="actualizado"></span>
        <button class="ghost-btn" id="btn-theme">☀︎ Claro</button>
        <button class="ghost-btn" id="btn-salir">Salir</button>
      </div>
    </div>
    <div class="crumbs" id="crumbs"></div>
  </header>
  <main id="main"></main>
  <div class="tt hidden" id="tt"></div>

<script>
(() => {
  const API = "https://hechizo-reporte-nuevo-production.up.railway.app";
  const KEY_STORAGE = "hechizo_web_key";
  const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const CAT_LABEL = {
    "Ingresos": "Ingresos", "Costo de Mercaderia": "Costo de mercadería", "Gastos por Ventas": "Gastos por ventas",
    "Gastos de Comercializacion": "Comercialización (envíos)", "Publicidad": "Publicidad",
    "Impuestos": "Impuestos", "Gastos de Administracion": "Administración",
  };

  const $main = document.getElementById("main");
  const $crumbs = document.getElementById("crumbs");
  let clave = lsGet(KEY_STORAGE) || "";
  let pnlData = null;

  // ═══════════════════ util ═══════════════════
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const nf0 = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 0 });
  const nf2 = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 2 });
  const money = v => (v == null || v === "" || isNaN(v)) ? "" : (v < 0 ? "−$ " : "$ ") + nf0.format(Math.abs(Math.round(v)));
  const moneyK = v => { if (!v) return "0"; const a = Math.abs(v); const s = v < 0 ? "−" : "";
    return a >= 1e6 ? `${s}$ ${nf2.format(a / 1e6)} M` : `${s}$ ${nf0.format(a / 1e3)} k`; };
  const num = v => (v < 0 ? "−" : "") + nf0.format(Math.abs(Math.round(v)));
  const pct = v => (v == null || !isFinite(v)) ? "" : nf2.format(v * 100) + " %";
  const fecha = s => { if (!s) return ""; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : String(s); };
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const hoyAR = () => new Date(new Date().toLocaleString("en-US", { timeZone: "America/Argentina/Buenos_Aires" }));
  const mesLabel = km => { const [a, m] = km.split("-").map(Number); return `${MESES_L[m - 1]} ${a}`; };
  const rangoLabel = (d, h) => d === h ? mesLabel(d) : (d.slice(5) === "01" && h.slice(5) === "12" && d.slice(0, 4) === h.slice(0, 4) ? `año ${d.slice(0, 4)}` : `${mesLabel(d)} – ${mesLabel(h)}`);
  const finDeMes = km => { const [a, m] = km.split("-").map(Number); return iso(new Date(a, m, 0)); };

  async function api(path) {
    const res = await fetch(API + path, { headers: { "X-Web-Key": clave }, cache: "no-store" });
    if (res.status === 401) { salir("La clave no es válida."); throw new Error("Clave incorrecta"); }
    const j = await res.json().catch(() => ({ ok: false, error: "Respuesta inválida (" + res.status + ")" }));
    if (!j.ok) throw new Error(j.error || "Error " + res.status);
    return j;
  }

  // ═══════════════════ navegación (pila de vistas) ═══════════════════
  let pila = [];
  function abrir(vista, reemplazarTodo = false) {
    if (reemplazarTodo) pila = [];
    pila.push(vista);
    history.pushState({ n: pila.length }, "");
    render();
  }
  function irA(i) { pila = pila.slice(0, i + 1); history.pushState({ n: pila.length }, ""); render(); }
  window.addEventListener("popstate", () => { if (pila.length > 1) { pila.pop(); render(); } });

  function render() {
    const v = pila[pila.length - 1];
    $crumbs.innerHTML = pila.map((p, i) => i === pila.length - 1
      ? `<span>${esc(p.titulo)}</span>` : `<a data-i="${i}">${esc(p.titulo)}</a><span class="sep">›</span>`).join("");
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.sec === pila[0].sec));
    $main.innerHTML = "";
    alRedimensionar = null; ocultarTip();
    window.scrollTo(0, 0);
    v.render($main);
  }
  $crumbs.addEventListener("click", e => { const a = e.target.closest("a[data-i]"); if (a) irA(+a.dataset.i); });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".nav-btn"); if (!b) return;
    abrir(SECCIONES[b.dataset.sec](), true);
  });

  function cargando(el, txt = "Cargando…") { el.innerHTML = `<div class="loading">${esc(txt)}</div>`; }
  function errorEn(el, err) { el.innerHTML = `<div class="error-box">No se pudo cargar: ${esc(err.message || err)}</div>`; }

  // ═══════════════════ tabla genérica ═══════════════════
  // opts: columnas [{key,label,tipo,filtro}], filas, onRow(fila), buscar (bool), exportar (nombre), totales (bool)
  function tabla(el, opts) {
    const st = { orden: opts.ordenInicial || null, asc: opts.ascInicial ?? false, q: "", filtros: { ...(opts.filtrosIniciales || {}) }, limite: 500 };
    const cols = opts.columnas;
    const numTipos = new Set(["money", "int", "num", "pct"]);
    el.innerHTML = `
      <div class="toolbar">
        <input type="search" placeholder="Buscar…" data-r="q" />
        ${cols.filter(c => c.filtro).map(c => {
          const vals = [...new Set(opts.filas.map(f => f[c.key] ?? "").map(String))].sort();
          return `<select data-f="${c.key}"><option value="">${esc(c.label)}: todos</option>${vals.map(v => `<option value="${esc(v)}"${st.filtros[c.key] === v ? " selected" : ""}>${esc(v || "(vacío)")}</option>`).join("")}</select>`;
        }).join("")}
        <span class="spacer"></span>
        <span class="count" data-r="count"></span>
        ${opts.exportar ? `<button class="btn sec" data-r="csv">⤓ CSV</button>` : ""}
      </div>
      <div class="tbl-wrap"><table><thead></thead><tbody></tbody><tfoot></tfoot></table></div>
      <div class="more hidden"><button class="btn sec">Mostrar más</button></div>`;
    const $q = el.querySelector('[data-r="q"]'), $thead = el.querySelector("thead"), $tbody = el.querySelector("tbody"),
          $tfoot = el.querySelector("tfoot"), $count = el.querySelector('[data-r="count"]'), $more = el.querySelector(".more");

    function filtradas() {
      const q = st.q.trim().toLowerCase();
      let f = opts.filas.filter(r => Object.entries(st.filtros).every(([k, v]) => v === "" || String(r[k] ?? "") === v));
      if (q) f = f.filter(r => cols.some(c => String(r[c.key] ?? "").toLowerCase().includes(q)) || (opts.extraBusqueda || []).some(k => String(r[k] ?? "").toLowerCase().includes(q)));
      if (st.orden) {
        const c = cols.find(c => c.key === st.orden); const num = numTipos.has(c?.tipo);
        f = [...f].sort((a, b) => {
          let x = a[st.orden], y = b[st.orden];
          if (num) { x = +x || 0; y = +y || 0; return st.asc ? x - y : y - x; }
          x = String(x ?? ""); y = String(y ?? ""); return st.asc ? x.localeCompare(y, "es") : y.localeCompare(x, "es");
        });
      }
      return f;
    }
    function celda(c, v) {
      if (c.tipo === "money") return `<td class="num${v < 0 ? " neg" : ""}">${money(v)}</td>`;
      if (c.tipo === "int") return `<td class="num">${v == null ? "" : nf0.format(v)}</td>`;
      if (c.tipo === "num") return `<td class="num">${v == null ? "" : nf2.format(v)}</td>`;
      if (c.tipo === "pct") return `<td class="num">${pct(v)}</td>`;
      if (c.tipo === "fecha") return `<td>${esc(fecha(v))}</td>`;
      if (c.tipo === "bool") return `<td>${v ? "Sí" : ""}</td>`;
      return c.wrap ? `<td class="wrap">${esc(v)}</td>` : `<td class="txt" title="${esc(v)}">${esc(v)}</td>`;
    }
    function pintar() {
      const f = filtradas();
      $thead.innerHTML = "<tr>" + cols.map(c => `<th data-k="${c.key}" class="${numTipos.has(c.tipo) ? "num" : ""}${st.orden === c.key ? " sorted" : ""}">${esc(c.label)}${st.orden === c.key ? (st.asc ? " ▲" : " ▼") : ""}</th>`).join("") + "</tr>";
      const vis = f.slice(0, st.limite);
      $tbody.innerHTML = vis.map((r, i) => `<tr data-i="${i}"${opts.onRow && (!opts.rowLink || opts.rowLink(r)) ? ' class="link"' : ""}>${cols.map(c => celda(c, r[c.key])).join("")}</tr>`).join("")
        || `<tr><td colspan="${cols.length}" style="color:var(--muted);padding:20px">Sin resultados</td></tr>`;
      $tbody._filas = vis;
      if (opts.totales !== false && f.length) {
        $tfoot.innerHTML = "<tr>" + cols.map((c, i) => {
          if (c.tipo === "money" && c.sumar !== false) { const s = f.reduce((a, r) => a + (+r[c.key] || 0), 0); return `<td class="num${s < 0 ? " neg" : ""}">${money(s)}</td>`; }
          if (c.tipo === "int" && c.sumar !== false) return `<td class="num">${nf0.format(f.reduce((a, r) => a + (+r[c.key] || 0), 0))}</td>`;
          return `<td>${i === 0 ? "Total" : ""}</td>`;
        }).join("") + "</tr>";
      } else $tfoot.innerHTML = "";
      $count.textContent = f.length === opts.filas.length ? `${nf0.format(f.length)} ${f.length === 1 ? "fila" : "filas"}` : `${nf0.format(f.length)} de ${nf0.format(opts.filas.length)} filas`;
      $more.classList.toggle("hidden", f.length <= st.limite);
      if (opts.onFiltrar) opts.onFiltrar(f);
    }
    $q.addEventListener("input", () => { st.q = $q.value; st.limite = 500; pintar(); });
    el.querySelectorAll("select[data-f]").forEach(s => s.addEventListener("change", () => { st.filtros[s.dataset.f] = s.value; pintar(); }));
    $thead.addEventListener("click", e => { const th = e.target.closest("th"); if (!th) return;
      const k = th.dataset.k; if (st.orden === k) st.asc = !st.asc; else { st.orden = k; st.asc = !numTipos.has(cols.find(c => c.key === k).tipo); } pintar(); });
    $tbody.addEventListener("click", e => { const tr = e.target.closest("tr[data-i]"); if (!tr || !opts.onRow) return;
      const r = $tbody._filas[+tr.dataset.i]; if (!opts.rowLink || opts.rowLink(r)) opts.onRow(r); });
    $more.querySelector("button").addEventListener("click", () => { st.limite += 1000; pintar(); });
    const $csv = el.querySelector('[data-r="csv"]');
    if ($csv) $csv.addEventListener("click", () => exportarCSV(opts.exportar, cols, filtradas()));
    pintar();
  }

  function exportarCSV(nombre, cols, filas) {
    const fmt = (c, v) => {
      if (v == null) return "";
      if (["money", "num", "int", "pct"].includes(c.tipo)) return String(Math.round((+v || 0) * 100) / 100).replace(".", ",");
      if (c.tipo === "fecha") return fecha(v);
      const s = String(v); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const txt = "﻿" + [cols.map(c => c.label).join(";"), ...filas.map(r => cols.map(c => fmt(c, r[c.key])).join(";"))].join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], { type: "text/csv;charset=utf-8" }));
    a.download = nombre.replace(/[^\w\- áéíóúñ]/gi, "_") + ".csv";
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  // Selector de rango de fechas reutilizable
  function selectorRango(el, rango, onCambio) {
    const hoy = hoyAR();
    const presets = [
      ["Este mes", () => [iso(new Date(hoy.getFullYear(), hoy.getMonth(), 1)), iso(hoy)]],
      ["Mes pasado", () => [iso(new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1)), iso(new Date(hoy.getFullYear(), hoy.getMonth(), 0))]],
      ["Últimos 30 días", () => [iso(new Date(hoy - 29 * 864e5)), iso(hoy)]],
      ["Este año", () => [`${hoy.getFullYear()}-01-01`, iso(hoy)]],
      ["Año pasado", () => [`${hoy.getFullYear() - 1}-01-01`, `${hoy.getFullYear() - 1}-12-31`]],
      ["Todo", () => ["2022-01-01", iso(hoy)]],
    ];
    el.innerHTML = `<div class="toolbar">
      ${presets.map(([l], i) => `<button class="chip" data-p="${i}">${l}</button>`).join("")}
      <span style="width:8px"></span>
      <input type="date" data-r="d" value="${rango.desde}" /> <span class="count">a</span> <input type="date" data-r="h" value="${rango.hasta}" />
    </div>`;
    const $d = el.querySelector('[data-r="d"]'), $h = el.querySelector('[data-r="h"]');
    const marcar = () => el.querySelectorAll(".chip").forEach((c, i) => { const [a, b] = presets[i][1](); c.classList.toggle("active", a === rango.desde && b === rango.hasta); });
    el.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { [rango.desde, rango.hasta] = presets[+c.dataset.p][1](); $d.value = rango.desde; $h.value = rango.hasta; marcar(); onCambio(); }));
    [$d, $h].forEach(i => i.addEventListener("change", () => { if (!$d.value || !$h.value) return; rango.desde = $d.value; rango.hasta = $h.value; marcar(); onCambio(); }));
    marcar();
  }

  // ═══════════════════ RESULTADOS (P&L) ═══════════════════
  async function asegurarPnl(forzar = false) {
    if (pnlData && !forzar) return pnlData;
    const j = await api("/web/pnl");
    const cats = [];
    j.filas.forEach(f => { if (!cats.includes(f.cat)) cats.push(f.cat); });
    j.cats = cats;
    j.val = (rub, km) => +(j.valores[rub]?.[km] || 0);
    j.anios = [...new Set(j.meses.map(m => m.slice(0, 4)))].sort();
    pnlData = j;
    if (j.actualizado) {
      const d = new Date(j.actualizado);
      document.getElementById("actualizado").textContent = "P&L actualizado " + d.toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    }
    return j;
  }

  // Agregados de un conjunto de meses
  function agregados(P, meses) {
    const sumR = rub => meses.reduce((a, km) => a + P.val(rub, km), 0);
    const porRubro = {}; P.filas.forEach(f => porRubro[f.rubro] = sumR(f.rubro));
    const porCat = {}; P.cats.forEach(c => porCat[c] = P.filas.filter(f => f.cat === c).reduce((a, f) => a + porRubro[f.rubro], 0));
    const resultado = Object.values(porCat).reduce((a, b) => a + b, 0);
    const ingresos = porCat["Ingresos"] || 0;
    const estReal = resultado - (porRubro.compras || 0) - ((porRubro.ventas_min || 0) + (porRubro.ventas_may || 0)) / 2.8;
    return { porRubro, porCat, resultado, ingresos, margen: ingresos ? resultado / ingresos : null, estReal };
  }

  const pnlUI = { modo: null, abiertas: new Set(["Ingresos"]) };

  function vistaResultados() {
    return { sec: "resultados", titulo: "Estado de resultados", render: async el => {
      cargando(el);
      let P; try { P = await asegurarPnl(); } catch (e) { return errorEn(el, e); }
      const hoy = hoyAR(); const kmHoy = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, "0")}`;
      if (!pnlUI.modo) pnlUI.modo = P.anios.includes(String(hoy.getFullYear())) ? String(hoy.getFullYear()) : P.anios[P.anios.length - 1];

      // Columnas: meses de un año, o años
      let columnas;
      if (pnlUI.modo === "anual") columnas = P.anios.map(a => ({ label: a, meses: P.meses.filter(m => m.startsWith(a)), d: `${a}-01`, h: `${a}-12`, curso: a === String(hoy.getFullYear()) }));
      else columnas = MESES.map((l, i) => { const km = `${pnlUI.modo}-${String(i + 1).padStart(2, "0")}`; return { label: l, meses: P.meses.includes(km) ? [km] : [], d: km, h: km, curso: km === kmHoy }; }).filter(c => c.meses.length);
      const todos = columnas.flatMap(c => c.meses);
      const colTot = { label: pnlUI.modo === "anual" ? "Total" : `Total ${pnlUI.modo}`, meses: todos, d: columnas[0]?.d, h: columnas[columnas.length - 1]?.h, tot: true };
      const cols = [...columnas, colTot];
      const ag = cols.map(c => agregados(P, c.meses));

      const agTot = ag[ag.length - 1];
      el.innerHTML = `
        <div class="page-title">Estado de resultados</div>
        <div class="page-sub">Tocá cualquier número para ver de dónde sale. Tocá una categoría para abrir o cerrar sus rubros.</div>
        <div class="kpis">
          <div class="kpi"><div class="kpi-l">Ingresos ${esc(colTot.label.replace("Total ", ""))}</div><div class="kpi-v">${money(agTot.ingresos)}</div></div>
          <div class="kpi"><div class="kpi-l">Resultado neto</div><div class="kpi-v ${agTot.resultado < 0 ? "neg" : "pos"}">${money(agTot.resultado)}</div></div>
          <div class="kpi"><div class="kpi-l">Margen</div><div class="kpi-v">${pct(agTot.margen)}</div></div>
          <div class="kpi"><div class="kpi-l">Est. resultado real</div><div class="kpi-v">${money(agTot.estReal)}</div></div>
        </div>
        <div class="toolbar">
          ${P.anios.map(a => `<button class="chip${pnlUI.modo === a ? " active" : ""}" data-m="${a}">${a}</button>`).join("")}
          <button class="chip${pnlUI.modo === "anual" ? " active" : ""}" data-m="anual">Todos los años</button>
          <span class="spacer"></span>
          <button class="chip" data-r="expand">Abrir todo</button><button class="chip" data-r="collapse">Cerrar todo</button>
          <button class="chip" data-r="csv">⤓ CSV</button>
        </div>
        <div class="tbl-wrap pnl-wrap"><table class="pnl"><thead></thead><tbody></tbody></table></div>`;

      const $thead = el.querySelector("thead"), $tbody = el.querySelector("tbody");
      $thead.innerHTML = `<tr><th>Concepto (en $)</th>${cols.map(c => `<th class="${c.curso ? "en-curso" : ""}${c.tot ? " col-tot" : ""}" title="${c.curso ? "Período en curso" : ""}">${esc(c.label)}${c.curso ? " •" : ""}</th>`).join("")}</tr>`;
      const td = (v, ci, attrs = "") => {
        const c = cols[ci];
        return `<td class="cell${!v ? " zero" : v < 0 ? " neg" : ""}${c.tot ? " col-tot" : ""}" data-ci="${ci}" ${attrs}>${v ? num(v) : "–"}</td>`;
      };
      let html = "";
      P.cats.forEach(cat => {
        const open = pnlUI.abiertas.has(cat);
        html += `<tr class="cat${open ? " open" : ""}" data-cat="${esc(cat)}"><td>${esc(CAT_LABEL[cat] || cat)}</td>${ag.map((a, ci) => td(a.porCat[cat], ci, `data-tcat="${esc(cat)}"`)).join("")}</tr>`;
        if (open) P.filas.filter(f => f.cat === cat).forEach(f => {
          if (!ag.some(a => a.porRubro[f.rubro])) return;
          html += `<tr class="rub"><td>${esc(f.desc)}</td>${ag.map((a, ci) => td(a.porRubro[f.rubro], ci, `data-rub="${f.rubro}"`)).join("")}</tr>`;
        });
      });
      html += `<tr class="tot"><td>Resultado neto</td>${ag.map((a, ci) => td(a.resultado, ci, 'data-res="1"')).join("")}</tr>`;
      html += `<tr class="sub"><td>Margen sobre ingresos</td>${ag.map(a => `<td>${pct(a.margen)}</td>`).join("")}</tr>`;
      html += `<tr class="sub"><td title="Resultado sumando compras y restando un costo estimado de ventas/2,8">Est. resultado real</td>${ag.map(a => `<td class="${a.estReal < 0 ? "neg" : ""}">${num(a.estReal)}</td>`).join("")}</tr>`;
      $tbody.innerHTML = html;

      $tbody.addEventListener("click", e => {
        const cell = e.target.closest("td.cell");
        if (cell) {
          const c = cols[+cell.dataset.ci];
          if (cell.dataset.rub) return abrir(vistaRubro(cell.dataset.rub, c.d, c.h));
          if (cell.dataset.tcat) return abrir(vistaResumen(c.d, c.h, cell.dataset.tcat));
          if (cell.dataset.res) return abrir(vistaResumen(c.d, c.h));
          return;
        }
        const tr = e.target.closest("tr.cat");
        if (tr && e.target.closest("td:first-child")) {
          const cat = tr.dataset.cat; pnlUI.abiertas.has(cat) ? pnlUI.abiertas.delete(cat) : pnlUI.abiertas.add(cat); render();
        }
      });
      el.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => { pnlUI.modo = b.dataset.m; render(); }));
      el.querySelector('[data-r="expand"]').addEventListener("click", () => { P.cats.forEach(c => pnlUI.abiertas.add(c)); render(); });
      el.querySelector('[data-r="collapse"]').addEventListener("click", () => { pnlUI.abiertas.clear(); render(); });
      el.querySelector('[data-r="csv"]').addEventListener("click", () => {
        const filas = [];
        P.cats.forEach(cat => {
          filas.push({ c: CAT_LABEL[cat] || cat, ...Object.fromEntries(ag.map((a, i) => [i, a.porCat[cat]])) });
          P.filas.filter(f => f.cat === cat).forEach(f => filas.push({ c: "   " + f.desc, ...Object.fromEntries(ag.map((a, i) => [i, a.porRubro[f.rubro]])) }));
        });
        filas.push({ c: "Resultado neto", ...Object.fromEntries(ag.map((a, i) => [i, a.resultado])) });
        exportarCSV(`Hechizo P&L ${pnlUI.modo}`, [{ key: "c", label: "Concepto" }, ...cols.map((c, i) => ({ key: i, label: c.label, tipo: "money" }))], filas);
      });
    }};
  }

  // Resumen de un período: categorías y rubros con barras, todo clickeable
  function vistaResumen(d, h, soloCat = null) {
    const titulo = (soloCat ? (CAT_LABEL[soloCat] || soloCat) + " · " : "Resumen · ") + rangoLabel(d, h);
    return { titulo, render: async el => {
      cargando(el);
      let P; try { P = await asegurarPnl(); } catch (e) { return errorEn(el, e); }
      const meses = P.meses.filter(m => m >= d && m <= h);
      const a = agregados(P, meses);
      const max = Math.max(1, ...Object.values(a.porRubro).map(Math.abs));
      const cats = soloCat ? [soloCat] : P.cats;
      el.innerHTML = `
        <div class="page-title">${esc(titulo)}</div>
        <div class="page-sub">Tocá un rubro para ver cada movimiento.</div>
        <div class="kpis">
          <div class="kpi"><div class="kpi-l">Ingresos</div><div class="kpi-v">${money(a.ingresos)}</div></div>
          <div class="kpi"><div class="kpi-l">Egresos</div><div class="kpi-v neg">${money(a.resultado - a.ingresos)}</div></div>
          <div class="kpi"><div class="kpi-l">Resultado neto</div><div class="kpi-v ${a.resultado < 0 ? "neg" : "pos"}">${money(a.resultado)}</div></div>
          <div class="kpi"><div class="kpi-l">Margen</div><div class="kpi-v">${pct(a.margen)}</div></div>
          <div class="kpi clickable" data-r="ventas"><div class="kpi-l">Órdenes del período ›</div><div class="kpi-v" data-r="nord">…</div></div>
        </div>
        <div class="card">${cats.map(cat => `
          <div class="bar-row" data-cat="${esc(cat)}"><div class="lbl cat">${esc(CAT_LABEL[cat] || cat)}</div><div></div><div class="val ${a.porCat[cat] < 0 ? "neg" : ""}" style="font-weight:600">${money(a.porCat[cat])}</div></div>
          ${P.filas.filter(f => f.cat === cat && a.porRubro[f.rubro]).map(f => `
            <div class="bar-row" data-rub="${f.rubro}"><div class="lbl" style="padding-left:14px">${esc(f.desc)}</div>
              <div><div class="bar${a.porRubro[f.rubro] < 0 ? " neg" : ""}" style="width:${Math.abs(a.porRubro[f.rubro]) / max * 100}%"></div></div>
              <div class="val">${money(a.porRubro[f.rubro])}</div></div>`).join("")}`).join("")}
        </div>`;
      el.querySelectorAll(".bar-row[data-rub]").forEach(r => r.addEventListener("click", () => abrir(vistaRubro(r.dataset.rub, d, h))));
      el.querySelectorAll(".bar-row[data-cat]").forEach(r => r.addEventListener("click", () => { if (!soloCat) abrir(vistaResumen(d, h, r.dataset.cat)); }));
      const rango = { desde: `${d}-01`, hasta: finDeMes(h) };
      el.querySelector('[data-r="ventas"]').addEventListener("click", () => abrir(vistaVentas(rango, `Ventas · ${rangoLabel(d, h)}`)));
      api(`/web/ventas?desde=${rango.desde}&hasta=${rango.hasta}`).then(j => {
        const n = j.filas.length, t = j.filas.reduce((s, r) => s + r.total, 0);
        const $n = el.querySelector('[data-r="nord"]'); if ($n) $n.innerHTML = `${nf0.format(n)} <span class="count">· ticket ${money(n ? t / n : 0)}</span>`;
      }).catch(() => {});
    }};
  }

  // Detalle de un rubro en un período
  function vistaRubro(rubro, d, h) {
    const P = pnlData;
    const f = P?.filas.find(x => x.rubro === rubro);
    const titulo = `${f ? f.desc : rubro} · ${rangoLabel(d, h)}`;
    return { titulo, render: async el => {
      cargando(el, "Buscando cada movimiento…");
      let j; try { j = await api(`/web/rubro?rubro=${rubro}&desde=${d}&hasta=${h}`); } catch (e) { return errorEn(el, e); }
      const dif = Math.round(j.total_detalle - j.total_pnl);
      el.innerHTML = `
        <div class="page-title">${esc(titulo)}</div>
        <div class="page-sub">${esc(CAT_LABEL[f?.cat] || f?.cat || "")}</div>
        <div class="kpis">
          <div class="kpi"><div class="kpi-l">En el P&L</div><div class="kpi-v">${money(j.total_pnl)}</div></div>
          <div class="kpi"><div class="kpi-l">Suma del detalle</div><div class="kpi-v">${money(j.total_detalle)}</div></div>
          <div class="kpi"><div class="kpi-l">Movimientos</div><div class="kpi-v">${nf0.format(j.filas.length)}</div></div>
        </div>
        ${Math.abs(dif) < 1
          ? `<div class="notice ok">✓ El detalle suma exactamente lo mismo que el P&L.</div>`
          : `<div class="notice warn"><b>Diferencia con el P&L: ${money(dif)}.</b> ${difExplicacion(rubro, dif, h)}</div>`}
        ${j.notas?.length ? `<div class="notes">${j.notas.map(n => `<div>${esc(n)}</div>`).join("")}</div>` : ""}
        <div data-r="tabla"></div>`;
      const cols = j.columnas.map(c => ({ ...c, sumar: c.key === "valor" || !["mult", "cpc", "precio_unitario"].includes(c.key) }));
      tabla(el.querySelector('[data-r="tabla"]'), {
        columnas: cols, filas: j.filas, exportar: titulo, ordenInicial: "fecha", ascInicial: true,
        extraBusqueda: ["email", "tracking", "medio_pago"],
        onRow: j.link === "orden" ? r => abrir(vistaOrden(r.orden_id)) : null,
        rowLink: r => !!r.orden_id,
      });
    }};
  }

  function difExplicacion(rubro, dif, h) {
    const hoy = hoyAR(); const kmHoy = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, "0")}`;
    const curso = h >= kmHoy ? " Como incluye el mes en curso, también puede ser que haya movimientos nuevos desde la última corrida del reporte." : "";
    if (/^(ventas|dto|envio)_/.test(rubro))
      return "Suele ser por órdenes que se cancelaron o devolvieron después de cobradas: el reporte ya no las cuenta, pero siguen en la base de ventas." + curso;
    if (rubro === "com_pagonube" || rubro === "ret_iibb")
      return "El mes en curso se completa con el último export de PagoNube, que puede tener ventas que todavía no llegaron a la base." + curso;
    return "El detalle y el total salen de fuentes que se actualizan en momentos distintos." + curso;
  }

  // ═══════════════════ VENTAS ═══════════════════
  const C_ORDENES = [
    { key: "fecha", label: "Fecha", tipo: "fecha" },
    { key: "orden_id", label: "Orden", tipo: "texto" },
    { key: "cliente", label: "Cliente", tipo: "texto" },

  function graficoDiario(el, filas, desde, hasta) {
    const dias = (new Date(hasta) - new Date(desde)) / 864e5 + 1;
    const porMes = dias > 62;
    const key = r => porMes ? String(r.fecha).slice(0, 7) : String(r.fecha).slice(0, 10);
    const m = new Map();
    if (!porMes) for (let t = new Date(desde + "T12:00"); iso(t) <= hasta; t = new Date(t.getTime() + 864e5)) m.set(iso(t), 0);
    filas.forEach(r => m.set(key(r), (m.get(key(r)) || 0) + (+r.total || 0)));
    const pts = [...m.entries()].sort();
    if (pts.length < 2 || pts.length > 400) { el.innerHTML = ""; return; }
    const max = Math.max(...pts.map(p => p[1]), 1);
    const paso = Math.ceil(pts.length / 16);
    el.innerHTML = `<div class="card"><h3>Facturación por ${porMes ? "mes" : "día"}</h3>
      <div class="minibars">${pts.map(([k, v]) => `<div style="height:${v / max * 100}%" title="${porMes ? mesLabel(k) : fecha(k)}: ${money(v)}"></div>`).join("")}</div>
      <div class="minibars-lbl">${pts.map(([k], i) => `<span>${i % paso === 0 ? (porMes ? MESES[+k.slice(5) - 1] + " " + k.slice(2, 4) : k.slice(8)) : ""}</span>`).join("")}</div></div>`;
  }

  // ═══════════════════ gráficos (SVG a mano) ═══════════════════
  let alRedimensionar = null;
  let _rzT = null;
  window.addEventListener("resize", () => { clearTimeout(_rzT); _rzT = setTimeout(() => alRedimensionar && alRedimensionar(), 150); });

  const $tt = document.getElementById("tt");
  function mostrarTip(html, ev) {
    $tt.innerHTML = html; $tt.classList.remove("hidden");
    const r = $tt.getBoundingClientRect();
    let x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - 14;
    if (y + r.height > window.innerHeight - 8) y = ev.clientY - r.height - 14;
    $tt.style.left = x + "px"; $tt.style.top = y + "px";
  }
  function ocultarTip() { $tt.classList.add("hidden"); }

  function niceMax(v) {
    if (v <= 0) return 1;
    const p = 10 ** Math.floor(Math.log10(v)), f = v / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }
  const leyenda = series => `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.label || s.key)}</span>`).join("")}</div>`;

  // Barras apiladas. o: { cats:[{label,corto}], series:[{key,label,color}], valor(ci,key), pct, fmtY, fmtV, onClick(ci,key) }
  function graficoApilado(el, o) {
    const W = Math.max(320, el.clientWidth), H = 270, m = { l: 62, r: 8, t: 12, b: 26 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b, n = o.cats.length;
    const tot = o.cats.map((_, ci) => o.series.reduce((a, s) => a + Math.max(0, o.valor(ci, s.key) || 0), 0));
    const max = o.pct ? 1 : niceMax(Math.max(...tot, 1));
    const Y = v => m.t + ih - (v / max) * ih;
    const band = iw / n, bw = Math.min(44, band * 0.66);
    let g = "";
    for (let i = 0; i <= 4; i++) {
      const v = (max / 4) * i, y = Y(v);
      g += `<line class="${i ? "gl" : "ax"}" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/>`;
      g += `<text x="${m.l - 8}" y="${y + 4}" text-anchor="end">${o.pct ? Math.round(v * 100) + "%" : o.fmtY(v)}</text>`;
    }
    const paso = Math.ceil(n / Math.max(1, Math.floor(iw / 46)));
    let bands = "", segs = "";
    o.cats.forEach((c, ci) => {
      const bx = m.l + ci * band;
      bands += `<rect class="band" data-ci="${ci}" x="${bx}" y="${m.t}" width="${band}" height="${ih}"/>`;
      if (ci % paso === 0) g += `<text x="${bx + band / 2}" y="${H - 8}" text-anchor="middle">${esc(c.corto || c.label)}</text>`;
      const x0 = bx + (band - bw) / 2;
      const vis = o.series.map(s => ({ s, v: Math.max(0, o.valor(ci, s.key) || 0) })).filter(x => x.v > 0);
      let acc = 0;
      vis.forEach((x, j) => {
        const v = o.pct ? (tot[ci] ? x.v / tot[ci] : 0) : x.v;
        const yTop = Y(acc + v), yBot = Y(acc) - (j > 0 ? 2 : 0);  // 2px de superficie entre segmentos
        acc += v;
        const h = yBot - yTop;
        if (h <= 0.5) return;
        const r = j === vis.length - 1 ? Math.min(4, h, bw / 2) : 0;  // solo el extremo superior redondeado
        const d = `M${x0},${yBot}V${yTop + r}Q${x0},${yTop} ${x0 + r},${yTop}H${x0 + bw - r}Q${x0 + bw},${yTop} ${x0 + bw},${yTop + r}V${yBot}Z`;
        segs += `<path class="seg" data-ci="${ci}" data-k="${esc(x.s.key)}" d="${d}" fill="${x.s.color}"/>`;
      });
    });
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}${bands}${segs}</svg>`;
    const svg = el.querySelector("svg");
    let on = null;
    svg.addEventListener("mousemove", ev => {
      const t = ev.target.closest("[data-ci]"); if (!t) { ocultarTip(); return; }
      const ci = +t.dataset.ci;
      if (on !== ci) { svg.querySelectorAll(".band.on").forEach(b => b.classList.remove("on")); svg.querySelector(`.band[data-ci="${ci}"]`).classList.add("on"); on = ci; }
      const filas = o.series.map(s => ({ s, v: o.valor(ci, s.key) || 0 })).filter(x => x.v);
      mostrarTip(`<b>${esc(o.cats[ci].label)}</b>` + filas.slice().reverse().map(x =>
        `<div${t.dataset.k === x.s.key ? ' style="font-weight:600"' : ""}><span><i style="background:${x.s.color}"></i>${esc(x.s.label || x.s.key)}</span><span>${o.fmtV(x.v)} · ${pct(tot[ci] ? x.v / tot[ci] : 0)}</span></div>`).join("")
        + `<div class="tot"><span>Total</span><span>${o.fmtV(tot[ci])}</span></div>`, ev);
    });
    svg.addEventListener("mouseleave", () => { ocultarTip(); svg.querySelectorAll(".band.on").forEach(b => b.classList.remove("on")); on = null; });
    svg.addEventListener("click", ev => { const t = ev.target.closest("[data-ci]"); if (t && o.onClick) { ocultarTip(); o.onClick(+t.dataset.ci, t.dataset.k || null); } });
  }

  // Líneas con crosshair. o: { cats, series:[{key,label,color}], valor(ci,key) -> número|null, fmtY, fmtV }
  function graficoLineas(el, o) {
    const W = Math.max(320, el.clientWidth), H = 220, m = { l: 62, r: 140, t: 12, b: 26 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b, n = o.cats.length;
    const vals = o.series.flatMap(s => o.cats.map((_, ci) => o.valor(ci, s.key))).filter(v => v != null && isFinite(v));
    const max = niceMax(Math.max(...vals, 0.0001));
    const X = ci => m.l + (n === 1 ? iw / 2 : (ci / (n - 1)) * iw), Y = v => m.t + ih - (v / max) * ih;
    let g = "";
    for (let i = 0; i <= 4; i++) {
      const v = (max / 4) * i, y = Y(v);
      g += `<line class="${i ? "gl" : "ax"}" x1="${m.l}" x2="${m.l + iw}" y1="${y}" y2="${y}"/><text x="${m.l - 8}" y="${y + 4}" text-anchor="end">${o.fmtY(v)}</text>`;
    }
    const paso = Math.ceil(n / Math.max(1, Math.floor(iw / 46)));
    o.cats.forEach((c, ci) => { if (ci % paso === 0) g += `<text x="${X(ci)}" y="${H - 8}" text-anchor="middle">${esc(c.corto || c.label)}</text>`; });
    let lineas = "", etiquetas = [];
    o.series.forEach(s => {
      let d = "", last = null;
      o.cats.forEach((_, ci) => {
        const v = o.valor(ci, s.key);
        if (v == null || !isFinite(v)) { last = null; return; }
        d += `${last == null ? "M" : "L"}${X(ci)},${Y(v)}`; last = ci;
      });
      lineas += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      for (let ci = n - 1; ci >= 0; ci--) { const v = o.valor(ci, s.key); if (v != null && isFinite(v)) { etiquetas.push({ s, y: Y(v), x: X(ci), v }); break; } }
    });
    // Etiquetas directas al final de cada línea, separadas para que no se pisen
    etiquetas.sort((a, b) => a.y - b.y);
    for (let i = 1; i < etiquetas.length; i++) if (etiquetas[i].y - etiquetas[i - 1].y < 14) etiquetas[i].y = etiquetas[i - 1].y + 14;
    const dl = etiquetas.map(e => `<text class="dl" x="${e.x + 8}" y="${e.y + 4}">${esc(e.s.label || e.s.key)} ${o.fmtY(e.v)}</text>`).join("");
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}${lineas}${dl}<g class="hover"></g><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
    const svg = el.querySelector("svg"), $h = svg.querySelector(".hover");
    svg.addEventListener("mousemove", ev => {
      const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      const ci = Math.max(0, Math.min(n - 1, Math.round(n === 1 ? 0 : ((p.x - m.l) / iw) * (n - 1))));
      const x = X(ci);
      let h = `<line x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--axis)" stroke-width="1"/>`;
      const filas = [];

      mostrarTip(`<b>${esc(o.cats[ci].label)}</b>` + (filas.length ? filas.map(x => `<div><span><i style="background:${x.s.color}"></i>${esc(x.s.label || x.s.key)}</span><span>${o.fmtV(x.v, ci, x.s.key)}</span></div>`).join("") : `<div><span>Sin datos</span></div>`), ev);

  // ═══════════════════ COBRANZAS ═══════════════════
  const FORMAS = [
    { key: "Mercado Pago", color: "var(--s1)" },
    { key: "Pago Nube / Getnet", color: "var(--s2)" },
    { key: "Transferencia", color: "var(--s3)" },

  const cobUI = { modo: "u12", vista: "abs" };

  function vistaCobranzas() {
    return { sec: "cobranzas", titulo: "Cobranzas", render: async el => {
      cargando(el);
      const hoy = hoyAR(), kmHoy = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, "0")}`;
      let j; try { j = await api(`/web/cobranzas?desde=2022-01&hasta=${kmHoy}`); } catch (e) { return errorEn(el, e); }
      const D = {};  // D[km][forma] = { cobrado, ordenes }
      j.filas.forEach(f => { (D[f.mes] ||= {})[f.forma] = { cobrado: +f.cobrado || 0, ordenes: f.ordenes }; });
      const anios = [...new Set(Object.keys(D).map(k => k.slice(0, 4)))].sort();

      const kmMenos = (km, k) => { const [a, mm] = km.split("-").map(Number); const d = new Date(a, mm - 1 - k, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
      function periodos() {
        if (cobUI.modo === "anual") return anios.map(a => ({ label: `Año ${a}`, corto: a, meses: Object.keys(D).filter(k => k.startsWith(a)).sort(), d: `${a}-01`, h: a === kmHoy.slice(0, 4) ? kmHoy : `${a}-12` }));
        const kms = cobUI.modo === "u12" ? Array.from({ length: 12 }, (_, i) => kmMenos(kmHoy, 11 - i))
          : Array.from({ length: 12 }, (_, i) => `${cobUI.modo}-${String(i + 1).padStart(2, "0")}`).filter(k => k <= kmHoy);
        return kms.map(k => ({ label: mesLabel(k) + (k === kmHoy ? " (en curso)" : ""), corto: MESES[+k.slice(5) - 1] + (cobUI.modo === "u12" ? " " + k.slice(2, 4) : ""), meses: [k], d: k, h: k }));
      }
      const P = periodos();
      const val = (pi, forma) => P[pi].meses.reduce((a, k) => a + (D[k]?.[forma]?.cobrado || 0), 0);
      const com = (pi, rubro) => P[pi].meses.reduce((a, k) => a + -(j.comisiones[k]?.[rubro] || 0), 0);
      const costo = (pi, forma, rubro) => { const c = val(pi, forma); const x = com(pi, rubro); return c > 0 && x ? x / c : null; };

      // KPIs del período elegido
      const totF = f => P.reduce((a, _, pi) => a + val(pi, f), 0);
      const total = FORMAS.reduce((a, f) => a + totF(f.key), 0);
      const tarjeta = totF("Mercado Pago") + totF("Pago Nube / Getnet");
      const comTot = P.reduce((a, _, pi) => a + com(pi, "com_mp") + com(pi, "com_pagonube"), 0);
      const nombreModo = cobUI.modo === "u12" ? "últimos 12 meses" : cobUI.modo === "anual" ? "todos los años" : cobUI.modo;

      el.innerHTML = `
        <div class="page-title">Cobranzas</div>
        <div class="page-sub">Cuánto entra por cada forma de pago (órdenes pagadas de Tiendanube + ventas manuales cargadas con el bot). Tocá una barra para ver esas órdenes.</div>
        <div class="toolbar">
          <button class="chip${cobUI.modo === "u12" ? " active" : ""}" data-m="u12">Últimos 12 meses</button>
          ${anios.map(a => `<button class="chip${cobUI.modo === a ? " active" : ""}" data-m="${a}">${a}</button>`).join("")}

          <div class="kpi"><div class="kpi-l">Cobrado · ${esc(nombreModo)}</div><div class="kpi-v">${money(total)}</div></div>
          ${FORMAS.filter(f => totF(f.key)).map(f => `<div class="kpi"><div class="kpi-l"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${f.color};margin-right:6px"></i>${esc(f.label || f.key)}</div><div class="kpi-v">${pct(total ? totF(f.key) / total : 0)}</div><div class="count">${money(totF(f.key))}</div></div>`).join("")}
          <div class="kpi"><div class="kpi-l">Costo de cobrar con tarjeta</div><div class="kpi-v">${pct(tarjeta ? comTot / tarjeta : null)}</div><div class="count">${money(comTot)} en comisiones</div></div>
        </div>
        <div class="card">
          <div class="chart-head"><h3>Cobrado por forma de pago</h3><span class="spacer"></span>${leyenda(FORMAS)}
            <div class="seg-toggle"><button data-v="abs" class="${cobUI.vista === "abs" ? "on" : ""}">$</button><button data-v="pct" class="${cobUI.vista === "pct" ? "on" : ""}">% del total</button></div></div>
          <div class="chart" data-r="barras"></div>
        </div>
        <div class="card">
          <div class="chart-head"><h3>Costo de cobrar: comisión sobre lo cobrado</h3></div>
          <div class="chart" data-r="lineas"></div>
          <div class="chart-note">Aproximado: la comisión se imputa al mes en que se liquida y la venta al mes en que se hizo, así que un mes puede quedar un poco alto y el siguiente un poco bajo. Incluye costo de cuotas.</div>
        </div>
        <div data-r="tabla"></div>`;

      const dibujar = () => {
        graficoApilado(el.querySelector('[data-r="barras"]'), {
          cats: P, series: FORMAS, valor: val, pct: cobUI.vista === "pct", fmtY: moneyK, fmtV: money,
          onClick: (pi, forma) => {
            const p = P[pi];
            if (forma === "Ventas manuales") return abrir(vistaRubro("ventas_manual", p.d, p.h));
            abrir(vistaVentas({ desde: `${p.d}-01`, hasta: finDeMes(p.h) }, `Ventas · ${p.label}${forma ? " · " + forma : ""}`, forma ? { forma } : null));
          },
        });
        graficoLineas(el.querySelector('[data-r="lineas"]'), {
          cats: P,
          series: [{ key: "mp", label: "Mercado Pago", color: "var(--s1)" }, { key: "pn", label: "Pago Nube", color: "var(--s2)" }],
          valor: (pi, k) => k === "mp" ? costo(pi, "Mercado Pago", "com_mp") : costo(pi, "Pago Nube / Getnet", "com_pagonube"),
          fmtY: v => nf2.format(v * 100) + "%",
          fmtV: (v, pi, k) => `${nf2.format(v * 100)} % · ${money(k === "mp" ? com(pi, "com_mp") : com(pi, "com_pagonube"))}`,
        });
      };
      dibujar();
      alRedimensionar = dibujar;

      // Tabla: la misma información que el gráfico (sigue el toggle $ / %)
      const enPct = cobUI.vista === "pct";
      const filas = P.map((p, pi) => {
        const t = FORMAS.reduce((a, f) => a + val(pi, f.key), 0);
        const r = { periodo: p.label, pi, total: t, c_mp: costo(pi, "Mercado Pago", "com_mp"), c_pn: costo(pi, "Pago Nube / Getnet", "com_pagonube") };
        FORMAS.forEach(f => r[f.key] = enPct ? (t ? val(pi, f.key) / t : 0) : val(pi, f.key));
        r.ordenes = P[pi].meses.reduce((a, k) => a + Object.values(D[k] || {}).reduce((b, x) => b + (x.ordenes || 0), 0), 0);
        return r;

      tabla(el.querySelector('[data-r="tabla"]'), {
        columnas: [
          { key: "periodo", label: "Período", tipo: "texto" },

          { key: "total", label: "Total cobrado", tipo: "money" },
          { key: "ordenes", label: "Órdenes TN", tipo: "int" },
          { key: "c_mp", label: "Costo MP", tipo: "pct" },
          { key: "c_pn", label: "Costo PN", tipo: "pct" },
        ],
        filas, exportar: `Cobranzas ${nombreModo}`, totales: true,
        onRow: r => { const p = P[r.pi]; abrir(vistaVentas({ desde: `${p.d}-01`, hasta: finDeMes(p.h) }, `Ventas · ${p.label}`)); },
      });

      el.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => { cobUI.modo = b.dataset.m; render(); }));
      el.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => { cobUI.vista = b.dataset.v; render(); }));
    }};
  }

  // ═══════════════════ GRÁFICOS (análisis) ═══════════════════
  // "Ver datos": la tabla con los mismos números de cada gráfico (accesibilidad / modo claro)
  function verDatos(cols, filas) {
    return `<details class="ver-datos"><summary>Ver datos</summary><div class="tbl-wrap" style="max-height:320px"><table>
      <thead><tr>${cols.map(c => `<th class="${c.num ? "num" : ""}" style="cursor:default">${esc(c.label)}</th>`).join("")}</tr></thead>
      <tbody>${filas.map(f => `<tr>${cols.map(c => `<td class="${c.num ? "num" : ""}">${c.fmt ? c.fmt(f[c.key], f) : esc(f[c.key])}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;
  }

  // Mapa de calor día × hora (secuencial de un solo tono, mezclado con la superficie)
  function mapaCalor(el, o) {
    const W = Math.max(320, el.clientWidth), m = { l: 40, r: 8, t: 6, b: 24 };
    const cw = (W - m.l - m.r) / 24, ch = 26, H = m.t + ch * 7 + m.b;
    const max = Math.max(1, ...o.celdas.flat().map(c => c.ordenes));
    let g = "";
    o.dias.forEach((d, di) => {
      g += `<text x="${m.l - 8}" y="${m.t + di * ch + ch / 2 + 4}" text-anchor="end">${d}</text>`;
      for (let h = 0; h < 24; h++) {
        const c = o.celdas[di][h], p = c.ordenes ? 12 + 88 * (c.ordenes / max) : 0;
        const fill = c.ordenes ? `color-mix(in oklab, var(--s1) ${p.toFixed(0)}%, var(--card))` : "var(--zebra)";
        g += `<rect class="hm" data-d="${di}" data-h="${h}" x="${m.l + h * cw + 1}" y="${m.t + di * ch + 1}" width="${cw - 2}" height="${ch - 2}" rx="3" fill="${fill}"/>`;
      }
    });
    for (let h = 0; h < 24; h += 2) g += `<text x="${m.l + h * cw + cw / 2}" y="${H - 8}" text-anchor="middle">${h}h</text>`;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}</svg>`;
    const svg = el.querySelector("svg");
    svg.addEventListener("mousemove", ev => {
      const t = ev.target.closest(".hm"); if (!t) return ocultarTip();
      const c = o.celdas[+t.dataset.d][+t.dataset.h];
      mostrarTip(`<b>${o.diasL[+t.dataset.d]} de ${t.dataset.h} a ${+t.dataset.h + 1} h</b><div><span>Órdenes</span><span>${nf0.format(c.ordenes)}</span></div><div><span>Facturado</span><span>${money(c.total)}</span></div>`, ev);
    });
    svg.addEventListener("mouseleave", ocultarTip);
  }

  // Barras horizontales divergentes (suben / bajan)
  function barrasDivergentes(el, o) {
    const W = Math.max(320, el.clientWidth), rowH = 24, m = { l: Math.min(300, W * 0.38), r: 70, t: 4, b: 4 };
    const H = m.t + o.filas.length * rowH + m.b, iw = W - m.l - m.r;
    const max = Math.max(1, ...o.filas.map(f => Math.abs(f.v)));
    const x0 = m.l + iw / 2, sc = (iw / 2) / max;
    let g = `<line class="ax" x1="${x0}" x2="${x0}" y1="${m.t}" y2="${H - m.b}"/>`;
    o.filas.forEach((f, i) => {
      const y = m.t + i * rowH, w = Math.max(2, Math.abs(f.v) * sc), bh = rowH - 8;
      const x = f.v >= 0 ? x0 : x0 - w, r = Math.min(4, bh / 2, w);
      const d = f.v >= 0
        ? `M${x},${y + 4}H${x + w - r}Q${x + w},${y + 4} ${x + w},${y + 4 + r}V${y + 4 + bh - r}Q${x + w},${y + 4 + bh} ${x + w - r},${y + 4 + bh}H${x}Z`
        : `M${x + w},${y + 4}H${x + r}Q${x},${y + 4} ${x},${y + 4 + r}V${y + 4 + bh - r}Q${x},${y + 4 + bh} ${x + r},${y + 4 + bh}H${x + w}Z`;
      g += `<rect class="band" data-i="${i}" x="0" y="${y}" width="${W}" height="${rowH}"/>`;
      g += `<path class="seg" data-i="${i}" d="${d}" fill="${f.v >= 0 ? "var(--s1)" : "var(--dneg)"}"/>`;
      g += `<text x="${m.l - 10}" y="${y + rowH / 2 + 4}" text-anchor="end" class="dl">${esc(f.label.length > 42 ? f.label.slice(0, 41) + "…" : f.label)}</text>`;
      g += `<text x="${f.v >= 0 ? x + w + 6 : x - 6}" y="${y + rowH / 2 + 4}" text-anchor="${f.v >= 0 ? "start" : "end"}">${f.v > 0 ? "+" : ""}${nf0.format(f.v)}</text>`;
    });
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}</svg>`;
    const svg = el.querySelector("svg");
    svg.addEventListener("mousemove", ev => { const t = ev.target.closest("[data-i]"); if (!t) return ocultarTip(); mostrarTip(o.tip(o.filas[+t.dataset.i]), ev); });
    svg.addEventListener("mouseleave", ocultarTip);
    svg.addEventListener("click", ev => { const t = ev.target.closest("[data-i]"); if (t && o.onClick) { ocultarTip(); o.onClick(o.filas[+t.dataset.i]); } });
  }

  const grUI = { rango: "12", dias: 90, prodPor: "unidades" };

  const DIAS_L = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];

  function vistaGraficos() {

      // ── datos derivados

      const porDia = celdas.map(r => r.reduce((a, c) => a + c.ordenes, 0)), totDH = porDia.reduce((a, b) => a + b, 0);

      const ingMes = cats.map(c => agregados(P, [c.km]).ingresos);

      const anios = P.anios;
      const colorAnio = a => `var(--s${(anios.indexOf(a) % 5) + 1})`;
      const serAnios = anios.map(a => ({ key: a, label: a, color: colorAnio(a) }));
      const yoy = (a, mi, campo) => { const km = `${a}-${String(mi + 1).padStart(2, "0")}`; if (km >= kmHoy || !P.meses.includes(km)) return null; const g = agregados(P, [km]); return campo === "res" ? g.resultado : g.margen; };

      let prods = PC.filas.map(f => ({ id: f.producto_id, label: f.producto, ua: +f.u_act, ub: +f.u_ant, fa: +f.f_act, fb: +f.f_ant }));
      prods.forEach(p => p.v = grUI.prodPor === "unidades" ? p.ua - p.ub : p.fa - p.fb);
      const suben = prods.filter(p => p.v > 0).sort((a, b) => b.v - a.v).slice(0, 10);
      const bajan = prods.filter(p => p.v < 0).sort((a, b) => a.v - b.v).slice(0, 10).reverse();
      const prodFilas = [...suben, ...bajan];
      const fmtProd = v => grUI.prodPor === "unidades" ? nf0.format(v) : money(v);

      const dibujar = () => {
        mapaCalor(el.querySelector('[data-r="calor"]'), { dias: DIAS, diasL: DIAS_L, celdas });
        graficoApilado(el.querySelector('[data-r="pub"]'), {
          cats, series: SER_PUB, valor: (ci, k) => pubMes[ci][k], fmtY: moneyK, fmtV: money,
          onClick: ci => abrir(vistaResumen(cats[ci].km, cats[ci].km, "Publicidad")),
        });
        graficoLineas(el.querySelector('[data-r="roas"]'), {
          cats, series: [{ key: "r", label: "Ingresos / publicidad", color: "var(--s1)" }],
          valor: ci => { const p = pubMes[ci].meta + pubMes[ci].gads + pubMes[ci].ag; return p > 0 ? ingMes[ci] / p : null; },
          fmtY: v => nf2.format(v) + "x", fmtV: (v, ci) => `${nf2.format(v)}x · ${money(ingMes[ci])} / ${money(pubMes[ci].meta + pubMes[ci].gads + pubMes[ci].ag)}`,
        });
        graficoApilado(el.querySelector('[data-r="cli"]'), {
          cats, series: SER_CLI, valor: (ci, k) => k === "nuevos" ? +meses[ci].clientes_nuevos : meses[ci].clientes - meses[ci].clientes_nuevos,
          fmtY: v => nf0.format(v), fmtV: v => nf0.format(v) + " clientes",
          onClick: ci => abrir(vistaVentas({ desde: `${cats[ci].km}-01`, hasta: finDeMes(cats[ci].km) }, `Ventas · ${cats[ci].label}`)),
        });
        graficoLineas(el.querySelector('[data-r="res-yoy"]'), {
          cats: MESES.map((m, i) => ({ label: MESES_L[i], corto: m })), series: serAnios,
          valor: (mi, a) => yoy(a, mi, "res"), fmtY: moneyK, fmtV: money,
        });
        graficoLineas(el.querySelector('[data-r="mar-yoy"]'), {
          cats: MESES.map((m, i) => ({ label: MESES_L[i], corto: m })), series: serAnios,
          valor: (mi, a) => yoy(a, mi, "mar"), fmtY: v => nf2.format(Math.round(v * 1000) / 10) + "%", fmtV: v => pct(v),
        });
        graficoLineas(el.querySelector('[data-r="ticket"]'), {
          cats, series: [{ key: "t", label: "Ticket", color: "var(--s1)" }],
          valor: ci => meses[ci].ordenes ? meses[ci].total / meses[ci].ordenes : null, fmtY: moneyK, fmtV: (v, ci) => `${money(v)} · ${nf0.format(meses[ci].ordenes)} órdenes`,
        });
        graficoLineas(el.querySelector('[data-r="upo"]'), {
          cats, series: [{ key: "u", label: "Unidades", color: "var(--s3)" }],
          valor: ci => meses[ci].ordenes ? meses[ci].unidades / meses[ci].ordenes : null, fmtY: v => nf2.format(v), fmtV: (v, ci) => `${nf2.format(v)} unidades por orden · ${nf0.format(meses[ci].unidades)} en total`,
        });
        if (prodFilas.length) barrasDivergentes(el.querySelector('[data-r="prod"]'), {
          filas: prodFilas,
          tip: f => `<b>${esc(f.label)}</b><div><span>Últimos ${grUI.dias} días</span><span>${nf0.format(f.ua)} u · ${money(f.fa)}</span></div><div><span>${grUI.dias} días anteriores</span><span>${nf0.format(f.ub)} u · ${money(f.fb)}</span></div><div class="tot"><span>Cambio</span><span>${f.v > 0 ? "+" : ""}${fmtProd(f.v)}</span></div>`,
          onClick: f => abrir(vistaProducto(f.id, f.label)),
        });
        else el.querySelector('[data-r="prod"]').innerHTML = `<div class="count">Sin datos en el período.</div>`;
        graficoApilado(el.querySelector('[data-r="env"]'), {
          cats, series: SER_ENV, valor: (ci, k) => +meses[ci][k], fmtY: v => nf0.format(v), fmtV: v => nf0.format(v) + " envíos",
        });
        graficoLineas(el.querySelector('[data-r="gratis"]'), {
          cats, series: [{ key: "g", label: "Envío gratis", color: "var(--s2)" }],
          valor: ci => meses[ci].ordenes ? meses[ci].envio_gratis / meses[ci].ordenes : null,
          fmtY: v => nf2.format(Math.round(v * 1000) / 10) + "%", fmtV: (v, ci) => `${pct(v)} · ${nf0.format(meses[ci].envio_gratis)} de ${nf0.format(meses[ci].ordenes)}`,
        });
      };
      dibujar();
      alRedimensionar = dibujar;

      // ── textos y tablas "Ver datos"
      el.querySelector('[data-r="ley-anios"]').innerHTML = leyenda(serAnios);
      el.querySelector('[data-r="calor-dias"]').innerHTML = totDH
        ? `Día con más compras: <b>${DIAS_L[topDia]}</b> (${pct(porDia[topDia] / totDH)}). Franja horaria pico: <b>${topHora} a ${topHora + 1} h</b>. ${nf0.format(totDH)} órdenes en total.`
        : "Sin datos de hora para este período.";
      el.querySelector('[data-r="calor-datos"]').innerHTML = verDatos(
        [{ key: "d", label: "Día" }, ...Array.from({ length: 24 }, (_, h) => ({ key: h, label: h + "h", num: true })), { key: "t", label: "Total", num: true }],
        DIAS_L.map((d, di) => ({ d, ...Object.fromEntries(celdas[di].map((c, h) => [h, c.ordenes])), t: porDia[di] })));
      el.querySelector('[data-r="pub-datos"]').innerHTML = verDatos(
        [{ key: "m", label: "Mes" }, { key: "meta", label: "Meta", num: true, fmt: money }, { key: "gads", label: "Google", num: true, fmt: money },
         { key: "ag", label: "Agencia", num: true, fmt: money }, { key: "ing", label: "Ingresos", num: true, fmt: money }, { key: "r", label: "Ingresos / publicidad", num: true, fmt: v => v == null ? "–" : nf2.format(v) + "x" }],
        cats.map((c, ci) => { const p = pubMes[ci].meta + pubMes[ci].gads + pubMes[ci].ag; return { m: c.label, ...pubMes[ci], ing: ingMes[ci], r: p > 0 ? ingMes[ci] / p : null }; }).reverse());
      el.querySelector('[data-r="cli-datos"]').innerHTML = verDatos(
        [{ key: "m", label: "Mes" }, { key: "c", label: "Clientes", num: true, fmt: v => nf0.format(v) }, { key: "n", label: "Nuevos", num: true, fmt: v => nf0.format(v) },
         { key: "p", label: "% nuevos", num: true, fmt: v => pct(v) }, { key: "tn", label: "Facturado por nuevos", num: true, fmt: money }],
        meses.map((r, ci) => ({ m: cats[ci].label, c: r.clientes, n: r.clientes_nuevos, p: r.clientes ? r.clientes_nuevos / r.clientes : 0, tn: r.total_nuevos })).reverse());
      el.querySelector('[data-r="ticket-datos"]').innerHTML = verDatos(
        [{ key: "m", label: "Mes" }, { key: "o", label: "Órdenes", num: true, fmt: v => nf0.format(v) }, { key: "t", label: "Ticket promedio", num: true, fmt: money },
         { key: "u", label: "Unidades", num: true, fmt: v => nf0.format(v) }, { key: "upo", label: "Unidades por orden", num: true, fmt: v => nf2.format(v) }],
        meses.map((r, ci) => ({ m: cats[ci].label, o: r.ordenes, t: r.ordenes ? r.total / r.ordenes : 0, u: r.unidades, upo: r.ordenes ? r.unidades / r.ordenes : 0 })).reverse());
      el.querySelector('[data-r="prod-datos"]').innerHTML = verDatos(
        [{ key: "label", label: "Producto" }, { key: "ub", label: `Unid. ${grUI.dias} días ant.`, num: true, fmt: v => nf0.format(v) }, { key: "ua", label: `Unid. últimos ${grUI.dias}`, num: true, fmt: v => nf0.format(v) },
         { key: "fb", label: "$ antes", num: true, fmt: money }, { key: "fa", label: "$ ahora", num: true, fmt: money }, { key: "v", label: "Cambio", num: true, fmt: fmtProd }],
        prodFilas);
      el.querySelector('[data-r="env-datos"]').innerHTML = verDatos(
        [{ key: "m", label: "Mes" }, ...SER_ENV.map(s => ({ key: s.key, label: s.label, num: true, fmt: v => nf0.format(v) })),
         { key: "g", label: "Envío gratis", num: true, fmt: v => nf0.format(v) }, { key: "ec", label: "Envío cobrado", num: true, fmt: money }],
        meses.map((r, ci) => ({ m: cats[ci].label, ...r, g: r.envio_gratis, ec: r.envio_cobrado })).reverse());

      el.querySelectorAll("[data-rg]").forEach(b => b.addEventListener("click", () => { grUI.rango = b.dataset.rg; render(); }));
      el.querySelectorAll("[data-dias]").forEach(b => b.addEventListener("click", () => { grUI.dias = +b.dataset.dias; render(); }));
      el.querySelectorAll("[data-pp]").forEach(b => b.addEventListener("click", () => { grUI.prodPor = b.dataset.pp; render(); }));
    }};
  }
  const SER_PUB = [{ key: "meta", label: "Meta", color: "var(--s1)" }, { key: "gads", label: "Google Ads", color: "var(--s2)" }, { key: "ag", label: "Agencia", color: "var(--s3)" }];
  const SER_CLI = [{ key: "rec", label: "Recurrentes", color: "var(--s1)" }, { key: "nuevos", label: "Nuevos", color: "var(--s2)" }];
  const SER_ENV = [{ key: "env_correo", label: "Correo Arg.", color: "var(--s1)" }, { key: "env_andreani", label: "Andreani", color: "var(--s2)" },
                   { key: "env_moto", label: "Moto", color: "var(--s3)" }, { key: "env_otro", label: "Otro / retiro", color: "var(--s4)" }];

  const SECCIONES = { resultados: vistaResultados, ventas: () => vistaVentas(), productos: vistaProductos, cobranzas: vistaCobranzas, clientes: vistaClientes, graficos: vistaGraficos };

  // ═══════════════════ login / arranque ═══════════════════
  function pantallaLogin(msg = "") {
    document.getElementById("header").classList.add("hidden");
    $main.innerHTML = `<div class="center"><form class="login" autocomplete="on">
      <img src="icon-192.png" alt="" /><h1>Hechizo</h1><p>Reporte web · acceso privado</p>
      <input type="text" name="username" value="hechizo" autocomplete="username" class="hidden" />
      <input type="password" name="password" placeholder="Clave" autocomplete="current-password" autofocus />
      <button class="btn" type="submit">Entrar</button><div class="err">${esc(msg)}</div></form></div>`;
    const form = $main.querySelector("form");
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const $err = form.querySelector(".err"); $err.textContent = "";
      clave = form.password.value.trim();
      try {
        const res = await fetch(API + "/web/check", { headers: { "X-Web-Key": clave }, cache: "no-store" });
        if (res.status === 401) { $err.textContent = "Clave incorrecta."; return; }
        if (!res.ok) { $err.textContent = "El servidor respondió " + res.status + "."; return; }
        lsSet(KEY_STORAGE, clave); arrancar();
      } catch (err) { $err.textContent = "No se pudo conectar con el servidor."; }
    });
  }

  function salir(msg = "") { clave = ""; lsSet(KEY_STORAGE, null); pnlData = null; pila = []; pantallaLogin(msg); }

  function arrancar() {
    document.getElementById("header").classList.remove("hidden");
    history.replaceState({ n: 1 }, "");
    pila = [vistaResultados()];
    render();
  }

  function aplicarTema(t) {
    document.body.classList.toggle("light", t === "light");
    document.getElementById("btn-theme").textContent = t === "light" ? "☾ Oscuro" : "☀︎ Claro";
  }
  aplicarTema(lsGet("hechizo_web_tema") || "dark");
  document.getElementById("btn-theme").addEventListener("click", () => {
    const t = document.body.classList.contains("light") ? "dark" : "light"; lsSet("hechizo_web_tema", t); aplicarTema(t);
  });
  document.getElementById("btn-salir").addEventListener("click", () => salir());

  clave ? arrancar() : pantallaLogin();
})();
</script>
</body>
</html>
